name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release

      - name: Zip web build
        run: cd build/web && zip -r ../../calculadora-web.zip .

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk calculadora.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            calculadora.apk
            calculadora-web.zip
          generate_release_notes: true
